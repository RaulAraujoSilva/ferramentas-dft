[project]
name = "dft-ferramentas"
version = "0.1.0"
description = "Ferramentas abertas para o Dimensionamento da Força de Trabalho no setor público (curso DFT, ECG/TCE-RJ)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Raul Araújo da Silva"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "statsmodels>=0.14"]

[project.optional-dependencies]
simulacao = ["simpy>=4.1"]
dev = ["pytest>=8"]

[project.scripts]
dft = "dft_ferramentas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dft_ferramentas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
